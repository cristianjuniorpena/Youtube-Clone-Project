<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-inicio logotipo">
            <button class="button-bars button-i">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div>
                <i class="fa-brands fa-youtube logotipo-icon"></i>
                <span class="logotipo-text">Youtube</span>
                <span class="logotipo-text-br">BR</span>
            </div>
        </div>

        <div class="cabecalho-meio logotipo">
            <div class="search">
                <input type="text" name="pesquisar" class="search-input">
            </div>
            <button class="search-button button-i">
                 <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button class="button-microphone button-i">
                <i class="fa-solid fa-microphone"></i>
            </button>

        </div>


        <div class="cabecalho-final logotipo">
            <button class="button-ellipsis button-i">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
            <button class="login button-i">
                <i class="fa-regular fa-circle-user"></i>
                <span class="login-text">Fazer login</span>
            </button>
        </div>
    </header>
    <main>
        <div class="main-left">
            <section class="sidebar">
                <a href="" class="sidebar-button"><i class="fa-regular fa-house"></i><span>Início</span></a>
                <a href="" class="sidebar-button"><i class="fa-brands fa-youtube-shorts"></i><span>Shorts</span></a>
                <a href="" class="sidebar-button"><i class="fa-brands fa-square-youtube"></i><span>Inscrições</span></a>
            </section>
            <section class="sidebar">
                <a href="" class="sidebar-button"><span class="voce">Você ></span></a>
                <a href="" class="sidebar-button"><i class="fa-regular fa-user"></i><span>seu canal</span></a>
                <a href="" class="sidebar-button"><i class="fa-solid fa-clock-rotate-left"></i><span>histórico</span></a>
                <a href="" class="sidebar-button"><i class="fa-solid fa-shuffle"></i><span>PlayLists</span></a>
                <a href="" class="sidebar-button"><i class="fa-regular fa-clock"></i><span>Assistir mais tarde</span></a>
                <a href="" class="sidebar-button"><i class="fa-regular fa-thumbs-up"></i><span>Vídeos com gostei</span></a>
                <a href="" class="sidebar-button"><i class="fa-solid fa-video"></i><span>Seus vídeos</span></a>
                <a href="" class="sidebar-button"><i class="fa-solid fa-download"></i><span>Downloads</span></a>
            </section>
            <section class="sidebar">
                <a href="" class="sidebar-button"></a>
                <a href="" class="sidebar-button"></a>
                <a href="" class="sidebar-button"></a>
            </section>
            <section class="sidebar">
                <a href="" class="sidebar-button"></a>
                <a href="" class="sidebar-button"></a>
                <a href="" class="sidebar-button"></a>
                <a href="" class="sidebar-button"></a>
            </section>
        </div>
        <section class="video-prin"></section>
        <section class="videos"></section>
    </main class='main'>
    <footer class="rodape"></footer>
</body>
</html>
