<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-inicio logotipo">
            <button class="button-bars button-i">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div>
                <i class="fa-brands fa-youtube logotipo-icon"></i>
                <span class="logotipo-text">Youtube</span>
                <span class="logotipo-text-br">BR</span>
            </div>
        </div>

        <div class="cabecalho-meio logotipo">
            <div class="search">
                <input type="text" name="pesquisar" class="search-input">
            </div>
            <button class="search-button button-i">
                 <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button class="button-microphone button-i">
                <i class="fa-solid fa-microphone"></i>
            </button>

        </div>


        <div class="cabecalho-final logotipo">
            <button class="button-ellipsis button-i">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
            <button class="login button-i">
                <i class="fa-regular fa-circle-user"></i>
                <span class="login-text">Fazer login</span>
            </button>
        </div>
    </header>
    <main></main>
    <footer></footer>
</body>
</html>
